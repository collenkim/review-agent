name: "AI Code Review"
description: "Claude 기반 diff 리뷰 — 컨벤션/요구사항/타영향(선택) 검토 후 PR에 코멘트를 남기고, high 심각도 finding이 있으면 실패시킨다."
inputs:
  github-token:
    description: "PR 코멘트 작성 및 diff 조회에 쓸 토큰"
    required: true
    default: ${{ github.token }}
  conventions:
    description: "컨벤션 문서 경로 (체크아웃된 레포 기준 상대경로)"
    required: true
  requirement:
    description: "요구사항 문서 경로. 생략하면 PR 본문을 요구사항으로 사용한다"
    required: false
  requirement-from-pr-body:
    description: "requirement 파일이 없을 때 PR 본문을 요구사항으로 쓸지"
    required: false
    default: "true"
  policy:
    description: "검증 범위 정책 문서 경로. 무엇을 지적/제외할지를 모든 dimension에 공통 적용"
    required: false
  blast-radius:
    description: "타 영향(blast-radius) dimension 실행 여부"
    required: false
    default: "false"
  test-coverage:
    description: "테스트 동반 여부(test-coverage) dimension 실행 여부"
    required: false
    default: "false"
  verify:
    description: "finding별 반박(verify) 단계 실행 여부"
    required: false
    default: "true"
  plan:
    description: "실행 전 diff를 보고 어떤 dimension이 실제로 필요한지 Claude가 판단해 불필요한 걸 끄게 할지"
    required: false
    default: "false"
runs:
  using: "node20"
  main: "action-dist/index.js"
